name: Azure production
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: azure-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/social-media-app/package-lock.json
      - run: npm ci
        working-directory: frontend/social-media-app
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend/social-media-app
      - run: npm run build
        working-directory: frontend/social-media-app
      - run: npm ci
        working-directory: backend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: backend
      - run: cp -R frontend/social-media-app/dist backend/public
      - run: npm test
        working-directory: backend
      - name: Package application (explicit allowlist, no .env)
        run: |
          mkdir -p release/public
          cp backend/package.json backend/package-lock.json backend/app.js release/
          cp -R backend/src release/src
          cp -R frontend/social-media-app/dist/. release/public/
          cd release
          npm ci --omit=dev
          zip -qr ../app.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: azure-app
          path: app.zip
          retention-days: 7
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: azure-app
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        id: deploy
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: app.zip
      - name: Verify application and database
        env:
          APP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "${APP_URL%/}/api/ready"
          curl --fail --silent --show-error "${APP_URL%/}/" > /dev/null
